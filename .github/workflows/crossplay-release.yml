# Turn a version tag into a release each supported device can install.
#
# Upstream's release.yml is still in this tree and still fires on every tag, but
# it builds gh_release, which is -DFREEINK_DEVICE_X4/X3 and therefore ESP32-C3.
# The X4 Pro is an S3. Device-specific asset names keep the three application
# images distinct, while firmware.bin remains the legacy X4 Pro alias.
name: CrossPlay release

on:
  push:
    tags:
      - "v*"
      - "*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-release-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install --upgrade https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Build
        run: |
          pio run -e x3_r11_5
          pio run -e x4_r11_5
          pio run -e x4pro_r11_5

      # USB installation needs a merged X4 Pro image. OTA installation uses a
      # device-specific application image selected from the device identity.
      #
      #   -full.bin  bootloader + partition table + app, flashed at 0x0 over
      #              USB. This is the one a first install needs. v1.0.0 and
      #              v1.0.1 shipped the app on its own and told people to write
      #              it to 0x0 -- which on an S3 is where the bootloader lives,
      #              so it landed on top of it.
      #   firmware-*.bin  application-only OTA images for each device.
      #   firmware.bin    X4 Pro compatibility alias for older installations.
      #
      # -fm/-fs/-ff keep: the flash mode, size and frequency already in the
      # bootloader header are the ones this build was configured with. Passing
      # them again by hand is a second copy of a fact that can drift; verified
      # byte-identical to spelling them out.
      - name: Name the artefacts
        run: |
          mkdir -p dist
          pip install --upgrade esptool
          python -m esptool --chip esp32s3 merge-bin --format raw \
            -o "dist/crossplay-${GITHUB_REF_NAME}-x4pro-full.bin" \
            -fm keep -fs keep -ff keep \
            0x0     .pio/build/x4pro_r11_5/bootloader.bin \
            0x8000  .pio/build/x4pro_r11_5/partitions.bin \
            0x10000 .pio/build/x4pro_r11_5/firmware.bin
          cp .pio/build/x4pro_r11_5/firmware.bin dist/firmware.bin
          cp .pio/build/x4pro_r11_5/firmware.bin dist/firmware-pro.bin
          cp .pio/build/x4_r11_5/firmware.bin dist/firmware-x4.bin
          cp .pio/build/x3_r11_5/firmware.bin dist/firmware-x3.bin
          cp .pio/build/x4pro_r11_5/firmware.elf \
             "dist/crossplay-${GITHUB_REF_NAME}-x4pro.elf"
          ls -la dist

      # A merged image that is not actually merged is indistinguishable from
      # the app image it replaces until someone bricks a device with it, so
      # check the three magic numbers rather than trust the exit code.
      - name: The merged image really is merged
        run: |
          full="dist/crossplay-${GITHUB_REF_NAME}-x4pro-full.bin"
          fail=0
          check() {  # offset, expected-magic, what
            got=$(dd if="$full" bs=1 skip=$1 count=2 2>/dev/null | xxd -p)
            if [ "$got" != "$2" ]; then
              echo "::error::$full at $(printf '0x%x' $1): expected $2 ($3), got $got"
              fail=1
            else
              echo "  $(printf '0x%-7x' $1) $got  $3"
            fi
          }
          check 0     e903 "bootloader"
          check 32768 aa50 "partition table"
          # ESP32-S3 application images use e908; e907 is the ESP32-C3 image
          # magic used by the X3/X4 application-only builds.
          check 65536 e908 "X4 Pro app"
          exit $fail

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          # Off on purpose. This fork carries upstream's whole history, and with
          # no previous tag of its own the generator has no floor: v1.0.0 would
          # have listed 1,319 commits, most of them CrossPoint's, as "what is
          # new in CrossPlay". A release note is a thing you write.
          generate_release_notes: false
          body: |
            ## Pokémon and sync

            - Catch-to-nickname navigation keeps the encounter snapshot valid, removing
              the stray placeholder screen between catching and naming a Pokémon.
            - KOReader Sync now asks the user to resolve near-equal percentages when the
              local and remote content positions are actually different.

            ## Reading journal

            - Work Reading counts Wednesday night every other week, beginning with the
              Sunday, October 4, 2026 work week; Sunday through Tuesday remain weekly.

            ## Farm

            - The farm overview explains each live weather modifier and shows the current
              reading streak instead of water and fertilizer stock.
            - Seed purchases no longer appear as bag inventory because purchased seeds are
              planted immediately.
            - Harvest Crops now acts directly from the main farm menu and reports the result
              at the bottom of the page.
            - The Shop header shows the current coin balance.

            - X3, X4, and X4 Pro production images are built from the same release.

            ## Firmware files

            - `firmware-pro.bin`: X4 Pro update image
            - `firmware-x4.bin`: X4 update image
            - `firmware-x3.bin`: X3 update image
            - `crossplay-<version>-x4pro-full.bin`: X4 Pro complete USB image
